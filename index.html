<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: rgb(15, 17, 21);
    color: rgb(230, 232, 236);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 12px 16px 0;
    border-bottom: 1px solid rgb(40, 44, 52);
  }
  .tab {
    padding: 10px 18px;
    cursor: pointer;
    color: rgb(150, 154, 162);
    border-radius: 6px 6px 0 0;
    font-size: 0.95rem;
    user-select: none;
  }
  .tab.active {
    color: rgb(230, 232, 236);
    background-color: rgb(22, 25, 30);
    font-weight: 600;
  }
  .tab-content {
    display: none;
    height: calc(100vh - 52px);
  }
  .tab-content.active { display: block; }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab" id="tab-industry" onclick="showTab('industry')">Industry Analysis</div>
    <div class="tab" id="tab-strategy" onclick="showTab('strategy')">Momentum Desk Strategy</div>
    <div class="tab" id="tab-journal" onclick="showTab('journal')">Trade Journal</div>
    <div class="tab" id="tab-backtest" onclick="showTab('backtest')">Backtest</div>
  </div>

  <div class="tab-content" id="content-industry">
    <iframe src="industry.html" title="Industry Analysis"></iframe>
  </div>
  <div class="tab-content" id="content-strategy">
    <iframe src="strategy.html" title="Momentum Desk Strategy"></iframe>
  </div>
  <div class="tab-content" id="content-journal">
    <iframe src="trade-journal.html" title="Trade Journal"></iframe>
  </div>
  <div class="tab-content" id="content-backtest">
    <iframe src="backtest.html" title="Backtest"></iframe>
  </div>

  <script>
    function showTab(name) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      document.getElementById('content-' + name).classList.add('active');
      history.replaceState(null, '', '#' + name);
    }
    // Default to the industry tab, unless the URL says otherwise.
    // Prefer #tab=strategy (a query param) over #strategy (a hash) --
    // the email link uses a query param specifically because hash
    // fragments get stripped by many email link-scanners/click-trackers,
    // while query params survive redirect-based link rewriting.
    const params = new URLSearchParams(window.location.search);
    const fromQuery = params.get('tab');
    const fromHash = window.location.hash.replace('#', '');
    const initial = fromQuery || fromHash || 'industry';
    showTab(initial);
  </script>
</body>
</html>
