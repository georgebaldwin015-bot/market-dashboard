    const win = (k, l) => `<button class="${acctWin === k ? "on" : ""}" data-w="${k}">${l}</button>`;
    const stat = (l, v, tone) => `<div class="mk ${tone || ""}" style="cursor:default"><div class="l">${l}</div><div class="v">${v}</div></div>`;
    const statRow = (st) => st.n ? stat("Trades", st.n) + stat("Win rate", st.win_rate + "%", st.win_rate >= 40 ? "good" : st.win_rate >= 25 ? "warn" : "bad")
      + stat("Avg R", rfmt(st.avg_r), st.avg_r > 0 ? "good" : "bad") + stat("Total R", (st.total_r > 0 ? "+" : "") + fmt(st.total_r, 1) + "R", st.total_r > 0 ? "good" : "bad")
      : '<div class="sub" style="grid-column:1/-1">No closed trades in this window.</div>';
    // The same trades (same window, by your exit date) had you used the chosen band's exit;
    // a trade the band would still hold counts at tonight's close.
    const days = { "30d": 30, "90d": 90, "365d": 365 }[acctWin];
    const cut = days ? new Date(new Date(acct.as_of).getTime() - days * 864e5).toISOString().slice(0, 10) : null;
    const inWin = acct.closed.filter((t) => !cut || (t.exit_date || "") >= cut);
    const sel = inWin.filter(gOk);
    const st = mkStats(sel.map((t) => t.r).filter((r) => r != null));
    const bst = mkStats(sel.map((t) => ((t.bands || {})[band] || {}).r).filter((r) => r != null));
    const nIn = (grp) => inWin.filter((t) => grp === "All" || (t.grade && GROUPS[grp].includes(t.grade.grade))).length;
    const gchipF = (grp, label) => `<button class="chip ${acctGrade === grp ? "on" : ""}" data-ag="${grp}">${label}<span class="n">${nIn(grp)}</span></button>`;
    // Growth % for the window, as on the chart (IBKR's windows; "All" includes the pre-history).
    const g = acct.growth, gi = g && g.bands ? g.bands.indexOf(band) : -1;
    const months = { "30d": 1, "90d": 3, "365d": 12 }[acctWin];
    const gCut = months ? (() => { const d = new Date(acct.as_of); d.setMonth(d.getMonth() - months); return d.toISOString().slice(0, 10); })() : null;
    const growthPct = (col) => { if (!g || !g.days || col < 1) return null;
      const pts = navSeries(g.days, col, gCut, gCut ? 0 : g.pre_history_pct || 0); return pts.length ? pts[pts.length - 1].value : null; };
    // Growth is whole-account: greyed out (neutral, dimmed) when a grade filter is on.
    const gstat = (v) => stat("Growth", v == null ? "–" : (v > 0 ? "+" : "") + fmt(v, 1) + "%",
      acctGrade !== "All" ? "na" : v == null ? "" : v > 0 ? "good" : "bad");
    // Your trades by the grade Today would have given them: your R vs the chosen band's.
    const gRows = GRADES.map((gr) => {
      const ts = inWin.filter((t) => t.grade && t.grade.grade === gr);
      if (!ts.length) return "";
      const avg = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
      const mine = avg(ts.map((t) => t.r).filter((r) => r != null));
      const bnd = avg(ts.map((t) => ((t.bands || {})[band] || {}).r).filter((r) => r != null));
      const wins = ts.filter((t) => t.r > 0).length;
      return `<tr style="${gOk({ grade: { grade: gr } }) ? "" : "opacity:.4"}"><td><span class="grade sm ${gcls(gr)}">${gr}</span></td><td>${ts.length}</td><td>${Math.round(100 * wins / ts.length)}%</td>
        <td class="${pc(mine)}">${rfmt(mine == null ? null : Math.round(mine * 100) / 100)}</td><td class="${pc(bnd)}">${rfmt(bnd == null ? null : Math.round(bnd * 100) / 100)}</td></tr>`;
    }).join("");
    // Success / failure per grade: wins vs losses (bar), win %, total R -- yours and the chosen band's.
    const wlRows = GRADES.map((gr) => {
      const ts = inWin.filter((t) => t.grade && t.grade.grade === gr);
      if (!ts.length) return "";
      const rs = ts.map((t) => t.r).filter((r) => r != null);
      const w = rs.filter((r) => r > 0).length, l = rs.length - w;
      const tot = rs.reduce((a, b) => a + b, 0);
      const brs = ts.map((t) => ((t.bands || {})[band] || {}).r).filter((r) => r != null);
      const bw = brs.filter((r) => r > 0).length, btot = brs.reduce((a, b) => a + b, 0);
      const bar = rs.length ? `<div class="wl"><i style="width:${100 * w / rs.length}%"></i><b style="width:${100 * l / rs.length}%"></b></div><div class="sub">${w} won · ${l} lost</div>` : "–";
      return `<tr style="${gOk({ grade: { grade: gr } }) ? "" : "opacity:.4"}"><td><span class="grade sm ${gcls(gr)}">${gr}</span></td><td>${bar}</td>
        <td>${rs.length ? Math.round(100 * w / rs.length) + "%" : "–"}<div class="sub">${bl()} ${brs.length ? Math.round(100 * bw / brs.length) + "%" : "–"}</div></td>
        <td class="${pc(tot)}">${rfmt(Math.round(tot * 10) / 10)}</td><td class="${pc(btot)}">${rfmt(Math.round(btot * 10) / 10)}</td></tr>`;
    }).join("");
    const PLAN = GROUPS.top;
    // Discipline: did each trade follow the rules? Plan grade (A+ and A), entry at the
    // 'Today' buy-stop (within 1%), exit no earlier than the chosen band (a stop-out counts
    // as following it; holding far past the stop doesn't).
    const disc = { plan: [0, 0], entry: [0, 0], exit: [0, 0], early: 0, earlyR: 0 };
    // Sold before the chosen band's rule did (a stop-out isn't early). George, 2026-10-05: on his 16 closed
    // A+ to B trades this cost ~21R, the biggest proven gain available, so it's flagged trade by trade.
    const earlyExit = (t) => { const b = (t.bands || {})[band];
      return !!(b && t.r != null && t.r > -0.8 && (b.exit == null || b.exit > (t.exit_date || ""))) ? b : null; };
    sel.forEach((t) => {
      const g = t.grade;
      if (g) { disc.plan[1]++; if (PLAN.includes(g.grade)) disc.plan[0]++; }
      if (g && g.buy_stop && t.entry) { disc.entry[1]++; if (Math.abs(t.entry / g.buy_stop - 1) <= 0.01) disc.entry[0]++; }
      const b = (t.bands || {})[band];
      if (t.r != null && b) {
        disc.exit[1]++;
        const stopped = t.r <= -0.8, heldPast = t.r < -1.3;
        const early = !stopped && (b.exit == null || b.exit > (t.exit_date || ""));
        if (!early && !heldPast) disc.exit[0]++;
        if (early) { disc.early++; disc.earlyR += (b.r || 0) - t.r; }
      }
    });
    const dTot = disc.plan[1] + disc.entry[1] + disc.exit[1], dOk = disc.plan[0] + disc.entry[0] + disc.exit[0];
    const dRow = (label, [ok, n], note) => n ? `<div class="row"><div>${label}<div class="sub">${note}</div>
      <div class="wl"><i style="width:${100 * ok / n}%"></i><b style="width:${100 * (n - ok) / n}%"></b></div></div><b>${ok}/${n}</b></div>` : "";
    const exMonths = {};
    acct.closed.filter(gOk).forEach((t) => {
      const b = (t.bands || {})[band]; if (t.r == null || !b || !t.exit_date) return;
      const m = (exMonths[t.exit_date.slice(0, 7)] ||= { n: 0, ok: 0, left: 0 });
      m.n++; const e = earlyExit(t);
      if (e) m.left += (e.r || 0) - t.r; else if (t.r >= -1.3) m.ok++;
    });
    const mRows = Object.keys(exMonths).sort().reverse().slice(0, 6).map((k) => { const m = exMonths[k];
      return `<tr><td>${esc(new Date(k + "-15T12:00:00").toLocaleDateString([], { month: "short", year: "2-digit" }))}</td><td>${m.ok}/${m.n}</td>
        <td class="${m.left > 0.05 ? "neg" : m.left < -0.05 ? "pos" : ""}">${Math.abs(m.left) < 0.05 ? "–" : (m.left > 0 ? "−" : "+") + fmt(Math.abs(m.left), 1) + "R"}</td></tr>`; }).join("");
    const discPanel = dTot ? `<div class="panel disc"><h3>Discipline <span class="sub">did each trade follow the rules</span></h3>
      <div class="score" style="color:${dOk / dTot >= 0.8 ? "var(--green)" : dOk / dTot >= 0.6 ? "var(--amber)" : "var(--red)"}">${Math.round(100 * dOk / dTot)}%</div>
      ${dRow("On-plan grade", disc.plan, "A+ and A only")}
      ${dRow("Entered at the buy-stop", disc.entry, "within 1% of the ‘Today’ buy-stop")}
      ${dRow(`Exited by the ${bl()} rule`, disc.exit, disc.early ? `${disc.early} sold before the band · that ${disc.earlyR >= 0 ? "cost" : "saved"} ${fmt(Math.abs(disc.earlyR), 1)}R vs holding to the band` : "no early exits")}
      ${mRows ? `<table class="st fit" style="margin-top:8px"><thead><tr><th>Month</th><th>Exits by the rule</th><th>Selling early cost</th></tr></thead><tbody>${mRows}</tbody></table>
        <div class="sub" style="margin-top:4px">Cost = what the ${bl()} rule made (or is making, if it would still be holding) minus what you took.</div>` : ""}
    </div>` : "";
    // Headline at the top: the exits are where the backtest and the account part ways.
    const exitStrip = disc.early && disc.earlyR > 0.5 ? `<div class="verdict behind">Selling before the ${bl()} rule cost <b>${fmt(disc.earlyR, 1)}R</b>
      on ${disc.early} trade${disc.early > 1 ? "s" : ""} in this window (about ${fmt(disc.earlyR * 0.75, 0)}% of the account at 0.75% risk). ${disc.exit[0]} of ${disc.exit[1]} exits followed the rule.</div>` : "";
    const wlTable = wlRows ? `<div class="panel"><h3>Wins &amp; losses by grade <span class="sub">your exits vs the ${bl()} exit on the same trades</span></h3>
      <table class="st fit"><thead><tr><th style="width:17%">Grade</th><th style="width:33%">Won / lost</th><th>Win %</th><th>Total R</th><th>${bl()} total</th></tr></thead><tbody>${wlRows}</tbody></table></div>` : "";
    const ungraded = inWin.filter((t) => !t.grade).length;
    const byGrade = gRows ? `<div class="panel"><h3>By grade <span class="sub">what ‘Today’ would have graded each entry · dashed = wasn't on the screen that day</span></h3>
      <table class="st fit"><thead><tr><th>Grade</th><th>Trades</th><th>Win</th><th>Avg R</th><th>${bl()} avg R</th></tr></thead><tbody>${gRows}</tbody></table>
      ${ungraded ? `<div class="sub" style="margin-top:6px">${ungraded} trade${ungraded > 1 ? "s" : ""} not graded (not enough price history).</div>` : ""}</div>` : "";
    const bandCards = statRow(bst) + (bst.n ? gstat(growthPct(gi < 0 ? -1 : 2 + gi)) : "");
    const cards = statRow(st) + (st.n ? gstat(growthPct(1)) : "");
    // Tap a grade badge for the one-line why (on/off 'Today' that day + the scoring points).
    const gtip = (g) => `${g.on_screen ? "On ‘Today’ that day" : "Not on ‘Today’ that day"}${g.on_screen && g.strategy ? " (" + g.strategy + ")" : ""} · ${(g.reasons || []).join(", ") || "no points"}${g.grade_v1 && g.grade_v1 !== g.grade ? ` · old grade ${g.grade_v1}` : ""}`;
    const gchip = (g) => g ? `<span class="grade sm inl ${gcls(g.grade)} ${g.on_screen ? "" : "off"}" role="button" data-gtip="${esc(gtip(g))}">${esc(g.grade)}</span>` : "";
    // Off plan = graded outside A+ and A; risk = % of the account put at risk on the entry.
    const offPlan = (x) => x.grade && !PLAN.includes(x.grade.grade);
    const riskTxt = (v) => v == null ? "" : `<span class="${v > 1.5 ? "neg" : v > 1.0 ? "warnc" : ""}">risked ${fmt(v, 1)}%</span>`;   // plan: 0.75%
    const pos = positions.map((p) => {
      // Tonight's stop is the chosen band's (outlined); the other bands are shown dimmed for comparison.
      const s = p.stops || {};
      const box = (k, l, cls) => `<div class="${cls}"><div class="k">${l}</div><div class="v">${s[k] == null ? "–" : fmt(s[k])}</div></div>`;
      const mine = (p.hit || []).find((h) => h.k === band);
      const hit = mine ? `⚠ ${bl()} band stop hit ${esc(mine.date)} at ${fmt(mine.price)}` : "";
      const also = (p.hit || []).filter((h) => h.k !== band && h.k !== "auto").map((h) => `${h.k}× out ${esc(h.date)} at ${fmt(h.price)}`).join(" · ");
      return `<div class="posn ${hit ? "alert" : ""}">
        <div class="top">${gchip(p.grade)}<a class="tk tkl" data-ticker="${esc(p.symbol)}">${esc(p.symbol)}</a>
          <span class="sub">since ${esc(p.entry_date)}${p.adds > 0 ? ` · ${p.adds} add${p.adds > 1 ? "s" : ""}` : ""}</span>${offPlan(p) ? '<span class="offplan">off plan</span>' : ""}
          <span class="big ${p.r_now > 0 ? "pos-c" : ""}" style="color:${p.r_now == null ? "var(--text)" : p.r_now >= 0 ? "var(--green)" : "var(--red)"}">${rfmt(p.r_now)}</span></div>
        <div class="sub">${fmt(p.quantity, p.quantity % 1 ? 2 : 0)} @ ${fmt(p.avg_price)} · last ${fmt(p.last)} (${p.pct == null ? "–" : (p.pct > 0 ? "+" : "") + fmt(p.pct, 1) + "%"}) · ADR ${fmt(p.adr_pct, 1)}%${p.risk_pct != null ? " · " + riskTxt(p.risk_pct) : ""}</div>
        ${p.earnings ? `<div class="sub" style="margin-top:4px">${ernTag(p.earnings)} ${esc(p.earnings.advice)}</div>` : ""}
        <div class="stops">${box("initial", "1× ADR", "dim")}${BAND_KS.map((k) => box(String(k), k + "×", k === posBand(p) ? "on" : "dim")).join("")}</div>
        ${hit ? `<div class="hit">${hit}</div>` : ""}${also ? `<div class="also">Other bands: ${also}</div>` : ""}</div>`;
    }).join("") || `<div class="empty" style="padding:14px 0">No open positions${acctGrade === "All" ? "" : " in this grade"}.</div>`;
    const act = acct.activity.map((a) => `<tr><td>${esc(a.date)}</td><td class="${a.side === "BUY" ? "buy" : "sell"}">${a.side === "BUY" ? "Buy" : "Sell"}</td>
      <td><b>${esc(a.symbol)}</b></td><td>${fmt(a.qty, a.qty % 1 ? 2 : 0)}</td><td>${fmt(a.price)}</td></tr>`).join("");
    let closed = acct.closed.filter(gOk); const closedTotal = closed.length;
    if (!showAllClosed) closed = closed.slice(0, 15);
    // You vs the rule, trade by trade: what you took, what the chosen exit made (or is making), and the gap.
    const dshort = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString([], { day: "numeric", month: "short" }) : "";
    let youSum = 0, ruleSum = 0;
    const cl = closed.map((t) => {
      const b = (t.bands || {})[band], gap = b && t.r != null && b.r != null ? b.r - t.r : null;
      if (gap != null) { youSum += t.r; ruleSum += b.r; }
      const gapCell = gap == null ? "<td>–</td>" : Math.abs(gap) < 0.15 ? '<td class="sub">same</td>'
        : `<td class="${gap > 0 ? "warnc" : "pos"}">${gap > 0 ? "−" + fmt(gap, 1) + "R" : "+" + fmt(-gap, 1) + "R"}<div class="sub">${gap > 0 ? "sold early" : "you did better"}</div></td>`;
      return `<tr><td>${gchip(t.grade)}<a class="tkl" data-ticker="${esc(t.symbol)}"><b>${esc(t.symbol)}</b></a>
          <div class="sub">out ${esc(dshort(t.exit_date))}${t.risk_pct != null ? " · risked " + fmt(t.risk_pct, 1) + "%" : ""}${offPlan(t) ? ' · <span class="neg">off plan</span>' : ""}</div></td>
        <td class="${pc(t.r)}">${rfmt(t.r)}</td>
        <td>${b ? `<span class="${pc(b.r)}">${rfmt(b.r)}</span><div class="sub">${b.exit ? "out " + esc(dshort(b.exit)) : "still in"}</div>` : "–"}</td>
        ${gapCell}</tr>`; }).join("");
    const clTotal = closed.length ? `<div class="sub" style="margin:0 2px 8px">These ${closed.length}: you <b class="${pc(youSum)}">${rfmt(Math.round(youSum * 10) / 10)}</b>,
      the ${bl()} rule <b class="${pc(ruleSum)}">${rfmt(Math.round(ruleSum * 10) / 10)}</b>${Math.abs(ruleSum - youSum) >= 0.15
        ? ` → ${ruleSum > youSum ? "the rule did <b>" + fmt(ruleSum - youSum, 1) + "R</b> better" : "you did <b>" + fmt(youSum - ruleSum, 1) + "R</b> better"}` : ""}.</div>` : "";
    el.innerHTML = `
      <h2>Account <span class="sub" style="font-weight:400">IBKR · ${esc(acct.as_of)}</span></h2>
      ${liveStrip()}
      <div class="toolbar"><div class="seg">${win("30d", "30d")}${win("90d", "90d")}${win("365d", "1y")}${win("all", "All")}</div></div>
      <div class="chips">${gchipF("top", "A+ & A")}${GRADES.map((gr) => gchipF(gr, gr)).join("")}${gchipF("All", "All")}</div>
      ${acctGrade === "All" ? "" : '<div class="openr">Filtered by the grade ‘Today’ would have given each entry. Growth is the whole account (it can\'t be split by grade).</div>'}
      ${exitStrip}
      <div class="rowlab">Your exits</div>
      <div class="mk-cards even" style="grid-template-columns:repeat(5,minmax(0,1fr))">${cards}</div>
      ${openR != null ? `<div class="openr">R boxes are closed trades only (open positions add ${rfmt(openR)}); Growth includes open positions.</div>` : ""}
      <div class="rowlab">${bl()} ADR exit <span>same trades</span></div>
      <div class="mk-cards even" style="grid-template-columns:repeat(5,minmax(0,1fr))">${bandCards}</div>
      <div class="panel"><h3>Growth <span class="sub">IBKR's return (open positions, real sizes) vs the same account on each ADR exit · ${bl()} solid, others dotted</span></h3>
        <div id="growth-cv" style="height:200px"></div><div class="legend" id="growth-leg"></div></div>
      <h2 style="margin-top:16px">Open positions <span class="sub" style="font-weight:400">tonight's stops · your ${bl()} exit is outlined</span></h2>
      ${pos}
      ${byGrade}
      ${wlTable}
      ${discPanel}
      <div class="panel"><h3>Recent activity</h3><table class="st fit"><thead><tr><th>Date</th><th>Side</th><th>Ticker</th><th>Qty</th><th>Price</th></tr></thead><tbody>${act}</tbody></table></div>
      <div class="panel"><h3>Closed trades <span class="sub">your exit vs the ${bl()} rule on the same entry</span></h3>
        ${clTotal}
        <table class="st fit"><thead><tr><th style="width:38%">Trade</th><th>You</th><th>Rule</th><th>Gap</th></tr></thead><tbody>${cl}</tbody></table>
        ${!showAllClosed && closedTotal > 15 ? `<button class="more" id="closed-more" style="margin-top:8px">Show all ${closedTotal}</button>` : ""}</div>`;
    el.querySelectorAll("[data-w]").forEach((b) => b.onclick = () => { acctWin = b.dataset.w; save("md.acctwin", acctWin); renderAccount(); });
    el.querySelectorAll("[data-ag]").forEach((b) => b.onclick = () => { acctGrade = b.dataset.ag; save("md.acctgrade", acctGrade); renderAccount(); });
    const cm = $("#closed-more"); if (cm) cm.onclick = () => { showAllClosed = true; renderAccount(); };
    el.querySelectorAll("[data-gtip]").forEach((c) => c.onclick = (e) => {
      e.stopPropagation();
      const d = document.createElement("div"); d.className = "gtip"; d.textContent = c.dataset.gtip;
      const card = c.closest(".posn");
      if (card) {                                   // position card: under its title line
        const old = card.querySelector(".gtip");
        if (old) { old.remove(); return; }
        card.querySelector(".top").after(d);
        return;
      }
      const tr = c.closest("tr");                   // table: a full-width row under the trade
      if (tr.nextElementSibling && tr.nextElementSibling.classList.contains("tiprow")) { tr.nextElementSibling.remove(); return; }
      const row = document.createElement("tr"); row.className = "tiprow";
      const td = document.createElement("td"); td.colSpan = tr.children.length; td.appendChild(d);
      row.appendChild(td); tr.after(row);
    });
    // Numbers never spill out of the stat boxes: shrink any that don't fit (narrow phones).
    el.querySelectorAll(".mk-cards.even .v").forEach((v) => {
      let f = 0.95;
      while (v.scrollWidth > v.clientWidth + 0.5 && f > 0.6) { f -= 0.05; v.style.fontSize = f + "rem"; }
    });
    drawGrowth();
  }

  let growthChart = null;
  // IBKR's daily time-weighted return (the Performance screen's number)
  // and the same account re-run with the rules' exits, chained over the
  // window. "All" starts from the return made before the daily history.
  function navSeries(rows, col, since, base) {
    let eq = 1 + base / 100; const pts = [];
    rows.forEach((r) => { if (since && r[0] < since) return; eq *= 1 + r[col] / 100; pts.push({ time: r[0], value: (eq - 1) * 100 }); });
    return pts;
  }
  function drawGrowth() {
    const box = $("#growth-cv"), leg = $("#growth-leg"); if (!box || !acct) return;
    const g = acct.growth;
    if (!g || !g.days || !g.days.length || !g.bands) { box.innerHTML = '<div class="msg">Growth appears after the next IBKR sync.</div>'; leg.innerHTML = ""; return; }
    // IBKR's windows are calendar months back, start day included (1Y from 25 Sep = 25 Sep onwards)
    const months = { "30d": 1, "90d": 3, "365d": 12 }[acctWin];
    const since = months ? (() => { const d = new Date(acct.as_of); d.setMonth(d.getMonth() - months); return d.toISOString().slice(0, 10); })() : null;
    const base = since ? 0 : g.pre_history_pct || 0;
    const actual = navSeries(g.days, 1, since, base);
    if (!actual.length) { box.innerHTML = '<div class="msg">No data in this window.</div>'; leg.innerHTML = ""; return; }
    const lines = g.bands.map((k, i) => ({ k, color: k === "auto" ? AUTO_COL : (BANDS.find((b) => b[0] === k) || [0, "#d29922"])[1].replace(/[\d.]+\)$/, "1)"),
      pts: navSeries(g.days, 2 + i, since, base) }));
    const start = new Date(new Date(actual[0].time).getTime() - 864e5).toISOString().slice(0, 10);
    [actual, ...lines.map((l) => l.pts)].forEach((p) => p.unshift({ time: start, value: base }));
    const last = (p) => p.length ? p[p.length - 1].value : 0;
    const pctS = (v) => (v > 0 ? "+" : "") + fmt(v, 1) + "%";
    leg.innerHTML = `<span><i class="pv"></i><b>IBKR ${pctS(last(actual))}</b></span>` + lines.map((l) => l.k === band
      ? `<span><i class="sel" style="border-color:${l.color}"></i><b>${blk(l.k)} ${pctS(last(l.pts))}</b></span>`
      : `<span><i style="border-color:${l.color}"></i>${blk(l.k)} ${pctS(last(l.pts))}</span>`).join("");
    loadLib().then((L) => {
      if (growthChart) { try { growthChart.remove(); } catch (e) {} }
      box.innerHTML = "";
      growthChart = L.createChart(box, { autoSize: true, layout: { background: { color: "transparent" }, textColor: "#8b949e", fontSize: 11 },
        grid: { vertLines: { visible: false }, horzLines: { color: "rgba(48,54,61,.45)" } },
        rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false }, handleScroll: false, handleScale: false,
        localization: { priceFormatter: (v) => fmt(v, 1) + "%" } });
      lines.filter((l) => l.k !== band).forEach((l) => growthChart.addLineSeries({ color: l.color.replace(/1\)$/, ".7)"), lineWidth: 1, lineStyle: 1,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }).setData(l.pts));
      const sel = lines.find((l) => l.k === band);
      if (sel) growthChart.addLineSeries({ color: sel.color, lineWidth: 1.5, priceLineVisible: false, lastValueVisible: true }).setData(sel.pts);
      growthChart.addLineSeries({ color: "#58a6ff", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: true }).setData(actual);
      growthChart.timeScale().fitContent();
    }).catch(() => { box.innerHTML = '<div class="msg">Chart couldn\'t load.</div>'; });
  }

  // ---------- settings sheet ----------
  $("#settings-btn").onclick = () => { $("#acct").value = settings.acct; $("#risk").value = settings.risk; $("#sheet").classList.add("open"); };
  $("#sheet-cancel").onclick = () => $("#sheet").classList.remove("open");
  $("#sheet").onclick = (e) => { if (e.target.id === "sheet") $("#sheet").classList.remove("open"); };
  $("#sheet-save").onclick = () => {
    const a = parseFloat($("#acct").value), r = parseFloat($("#risk").value);
    if (a > 0) settings.acct = a;
    if (r > 0 && r <= 10) settings.risk = r;
    save("md.settings", settings); $("#sheet").classList.remove("open"); renderToday();
  };

  // ---------- ticker page: chart with bands + your trades in that name ----------
  let tsChart = null;
  function openTicker(sym) {
    const sh = $("#tsheet"); sh.classList.add("open");
    $("#ts-title").textContent = sym;
    $("#ts-tv").href = "https://www.tradingview.com/chart/?symbol=" + encodeURIComponent(sym);
    const mine = acct ? acct.closed.filter((t) => t.symbol === sym) : [];
    const pos = acct ? acct.positions.find((p) => p.symbol === sym) : null;
    const g = (pos && pos.grade) || (mine[0] && mine[0].grade);
    $("#ts-sub").innerHTML = g ? `grade <span class="grade sm inl ${gcls(g.grade)} ${g.on_screen ? "" : "off"}">${esc(g.grade)}</span>` : "";
    const rows = mine.map((t) => { const b = (t.bands || {})[band];
      return `<tr><td>${esc(t.entry_date || "")}<div class="sub">→ ${esc(t.exit_date || "")}</div></td><td>${t.grade ? `<span class="grade sm ${gcls(t.grade.grade)}">${esc(t.grade.grade)}</span>` : "–"}</td>
        <td class="${pc(t.r)}">${rfmt(t.r)}</td><td class="${pc(b && b.r)}">${b ? rfmt(b.r) : "–"}</td></tr>`; }).join("");
    $("#ts-body").innerHTML = `<div class="panel"><div id="ts-chart"><div class="msg">Loading chart…</div></div><div class="legend" id="ts-leg"></div></div>
      ${pos ? `<div class="panel"><h3>Open position <span class="sub">since ${esc(pos.entry_date)} · ${rfmt(pos.r_now)} · ${bl()} stop ${fmt((pos.stops || {})[band])}</span></h3>
        ${pos.grade ? `<div class="sub">${esc(gtipText(pos.grade))}</div>` : ""}</div>` : ""}
      <div class="panel"><h3>Your trades in ${esc(sym)} <span class="sub">actual vs ${bl()} exit</span></h3>
        ${rows ? `<table class="st fit"><thead><tr><th>Dates</th><th>Grade</th><th>Actual</th><th>${bl()}</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="sub">No closed trades yet.</div>'}</div>`;
    Promise.all([loadLib(), loadBars(sym)]).then(([L, b]) => {
      const box = $("#ts-chart"); if (!box || !$("#tsheet").classList.contains("open")) return;
      box.innerHTML = "";
      if (tsChart) { try { tsChart.remove(); } catch (e) {} }
      tsChart = L.createChart(box, { autoSize: true, layout: { background: { color: "transparent" }, textColor: "#8b949e", fontSize: 11 },
        grid: { vertLines: { visible: false }, horzLines: { color: "rgba(48,54,61,.45)" } },
        rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false, rightOffset: 6 } });
      const cs = tsChart.addCandlestickSeries({ upColor: "#3fb950", downColor: "#f85149", borderVisible: false,
        wickUpColor: "#3fb950", wickDownColor: "#f85149", priceLineVisible: false, lastValueVisible: true });
      cs.setData(b.t.map((d, i) => ({ time: d, open: b.o[i], high: b.h[i], low: b.l[i], close: b.c[i] })));
      const adr = sma(b.h.map((h, i) => h - b.l[i]), 20);
      BANDS.forEach(([k, color]) => {
        const sel = k === posBand(pos);
        tsChart.addLineSeries({ color: sel ? color.replace(/[\d.]+\)$/, ".55)") : color, lineWidth: 1, lineStyle: sel ? 0 : 1,
          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false, autoscaleInfoProvider: () => null })
          .setData(b.t.map((d, i) => adr[i] == null ? { time: d } : { time: d, value: b.c[i] - k * adr[i] }));
      });
      // Your entries and exits on the chart.
      const first = b.t[0], mk = [];
      mine.forEach((t) => {
        if (t.entry_date >= first) mk.push({ time: t.entry_date, position: "belowBar", color: "#58a6ff", shape: "arrowUp", text: "B" });
        if (t.exit_date && t.exit_date >= first) mk.push({ time: t.exit_date, position: "aboveBar", color: t.r > 0 ? "#3fb950" : "#f85149", shape: "arrowDown", text: "S" });
      });
      if (pos && pos.entry_date >= first) mk.push({ time: pos.entry_date, position: "belowBar", color: "#58a6ff", shape: "arrowUp", text: "B" });
      mk.sort((a, c) => a.time < c.time ? -1 : a.time > c.time ? 1 : 0);
      cs.setMarkers(mk);
      if (pos && (pos.stops || {})[band] != null) cs.createPriceLine({ price: pos.stops[band], color: "#f85149", lineWidth: 1, lineStyle: 2, title: "", axisLabelVisible: true });
      tsChart.timeScale().fitContent();
      $("#ts-leg").innerHTML = `<span><i class="pv"></i>B = your buy</span><span>S = your sell</span>` + BANDS.map(([k, c]) => k === posBand(pos)
        ? `<span><i class="sel" style="border-color:${c.replace(/[\d.]+\)$/, ".95)")}"></i><b>${k}× exit${band === "auto" ? " (Auto)" : ""}</b></span>` : `<span><i style="border-color:${c.replace(/[\d.]+\)$/, ".6)")}"></i>${k}×</span>`).join("");
    }).catch(() => { const box = $("#ts-chart"); if (box) box.innerHTML = '<div class="msg">No chart data for this ticker yet (it appears after the next IBKR sync).</div>'; });
  }
  function closeTicker() { $("#tsheet").classList.remove("open"); if (tsChart) { try { tsChart.remove(); } catch (e) {} tsChart = null; } }
  $("#ts-close").onclick = closeTicker;
  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-ticker]");
    if (a) { e.preventDefault(); openTicker(a.dataset.ticker); }
  });
  const gtipText = (g) => `${g.on_screen ? "On ‘Today’ that day" : "Not on ‘Today’ that day"}${g.on_screen && g.strategy ? " (" + g.strategy + ")" : ""} · ${(g.reasons || []).join(", ") || "no points either way"}`;

  function renderBandPick() {
    const seg = $("#bandpick .seg");
    seg.innerHTML = EXIT_KS.map((k) => `<button class="${k === band ? "on" : ""}" data-band="${k}">${k === "auto" ? `Auto<span class="ak">${autoToday()}×</span>` : k + "×"}</button>`).join("");
    seg.querySelectorAll("button").forEach((b) => b.onclick = () => {
      band = b.dataset.band === "auto" ? "auto" : +b.dataset.band; save("md.band", band); renderBandPick();
      if (data) renderToday();
      document.querySelectorAll(".card.open[data-t]").forEach(drawChart);
      if (acct) renderAccount();
      if (bt) renderBacktest();
    });
    sizeTop();
  }
  renderBandPick();

  // ---------- boot ----------
  route(); sizeTop();
  fetch("today.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => { data = d; renderMarket(d); renderToday(); renderBandPick(); })
    .catch(() => { $("#advice").textContent = "Market state unavailable -- today.json appears after the next nightly run."; renderToday(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(() => {});
})();
</script>
</body>
</html>
