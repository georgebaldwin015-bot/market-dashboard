<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Edge Lab">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Edge Lab</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2230; --line: #2a313c;
    --text: #e6e8ec; --muted: #8b949e; --faint: #6e7681;
    --green: #3fb950; --amber: #d29922; --red: #f85149; --blue: #58a6ff;
    --Ap: #56d364; --A: #7ee787; --B: #79c0ff; --C: #e3b341; --D: #f0883e; --F: #ff7b72;
    --nav-h: 62px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }

  /* Market bar: always on top, every screen */
  #market { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--bg);
    padding: calc(8px + var(--safe-t)) 16px 8px; border-bottom: 1px solid var(--line); }
  .mrow { display: flex; align-items: center; gap: 10px; }
  .pill { font-weight: 700; font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; letter-spacing: .02em; }
  .pill.bull { background: rgba(63,185,80,.18); color: var(--green); }
  .pill.transition { background: rgba(210,153,34,.18); color: var(--amber); }
  .pill.bear { background: rgba(248,81,73,.18); color: var(--red); }
  .pill.unknown { background: var(--panel2); color: var(--muted); }
  #advice { font-size: 0.85rem; color: var(--text); flex: 1; min-width: 0; }
  /* Exit band picker: one choice for every screen */
  #bandpick { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  #bandpick span { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #bandpick .seg button { padding: 3px 7px; font-size: 0.72rem; }
  #bandpick .seg button .ak { font-size: 0.6rem; text-transform: none; letter-spacing: 0; margin-left: 3px; opacity: .75; color: inherit; }
  #conf { display: none; margin-top: 7px; font-size: 0.8rem; color: var(--muted); align-items: baseline; gap: 8px; }
  #conf b { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  #conf.high b { background: rgba(63,185,80,.18); color: var(--green); }
  #conf.normal b { background: rgba(88,166,255,.16); color: var(--blue); }
  #conf.selective b { background: rgba(210,153,34,.18); color: var(--amber); }
  #conf.low b { background: rgba(248,81,73,.18); color: var(--red); }
  .card.out { opacity: .55; }
  .outtag { font-size: 0.68rem; color: var(--faint); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  #mstats { display: flex; gap: 14px; margin-top: 6px; font-size: 0.75rem; color: var(--muted); overflow-x: auto; white-space: nowrap; }
  #mstats b { color: var(--text); font-weight: 600; }
  #stale { display: none; margin-top: 6px; font-size: 0.75rem; color: var(--amber); }
  .iconbtn { background: none; border: 0; padding: 4px; color: var(--muted); cursor: pointer; }

  /* Views */
  main { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); top: var(--top-h, 92px); }
  .view { display: none; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view.active { display: block; }
  .view iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .pad { padding: 14px 16px 24px; max-width: 900px; margin: 0 auto; }

  /* Bottom nav */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel);
    border-top: 1px solid var(--line); display: flex; padding-bottom: var(--safe-b); }
  nav button { flex: 1; height: var(--nav-h); background: none; border: 0; color: var(--faint);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 0.68rem; cursor: pointer; }
  nav button svg { width: 22px; height: 22px; }
  nav button.active { color: var(--blue); }

  /* Today */
  h2 { font-size: 1.05rem; margin: 4px 0 10px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px;
    font-size: 0.82rem; cursor: pointer; color: var(--muted); }
  .chip.on { color: var(--text); border-color: var(--blue); background: rgba(88,166,255,.12); }
  .chip .n { font-weight: 700; margin-left: 4px; }
  .search { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 9px 12px; font-size: 16px; margin-bottom: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .chead { display: flex; align-items: center; gap: 10px; }
  .grade { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; flex: none; }
  .gAp { background: rgba(46,160,67,.4); color: var(--Ap); } .gA { background: rgba(46,160,67,.22); color: var(--A); }
  .gB { background: rgba(88,166,255,.2); color: var(--B); } .gC { background: rgba(210,153,34,.2); color: var(--C); }
  .gD { background: rgba(240,136,62,.2); color: var(--D); } .gF { background: rgba(248,81,73,.2); color: var(--F); }
  .gAp { font-size: 0.85rem; }
  .card { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .card.open { border-color: #3a4350; }
  .caret { color: var(--faint); font-size: 0.8rem; transition: transform .15s; margin-left: 2px; }
  .card.open .caret { transform: rotate(180deg); }
  .chartbox { display: none; margin: 10px -6px 0; cursor: default; }
  .card.open .chartbox { display: block; }
  .chartbox .cv { height: 280px; }
  .chartbox img { width: 100%; border-radius: 8px; }
  .chartbox .msg { color: var(--muted); font-size: 0.8rem; padding: 20px 0; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.72rem; color: var(--muted); margin: 6px 6px 0; align-items: center; }
  .legend i { display: inline-block; width: 14px; border-top: 2px dotted; vertical-align: middle; margin-right: 4px; }
  .legend i.solid { border-top-style: dashed; } .legend i.pv { border-top: 2px solid var(--blue); }
  .legend i.sel { border-top-style: solid; border-top-width: 3px; } .legend b { color: var(--text); }
  .legend a { margin-left: auto; color: var(--blue); text-decoration: none; }
  .tk { font-weight: 700; font-size: 1.05rem; color: var(--text); text-decoration: none; }
  .sub { font-size: 0.78rem; color: var(--muted); }
  .grow { flex: 1; min-width: 0; }
  .near { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
  .near.hot { color: var(--amber); background: rgba(210,153,34,.15); }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .lv { background: var(--panel2); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  .lv .k { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .lv .v { font-size: 0.95rem; font-weight: 600; margin-top: 2px; }
  .lv .x { font-size: 0.7rem; color: var(--faint); }
  .reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .rz { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; background: var(--panel2); color: var(--muted); }
  .rz.p { background: rgba(46,160,67,.15); color: var(--A); } .rz.n { background: rgba(248,81,73,.15); color: var(--D); }
  details.why { margin-top: 8px; font-size: 0.8rem; }
  details.why summary { color: var(--muted); cursor: pointer; }
  details.why ul { margin: 6px 0 0 18px; padding: 0; }
  details.why li { margin: 3px 0; color: var(--muted); }
  details.why li.p { color: var(--A); } details.why li.n { color: var(--D); }
  .foot { font-size: 0.75rem; color: var(--faint); line-height: 1.5; margin-top: 16px; }
  .foot summary { cursor: pointer; display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; list-style: none; margin-bottom: 6px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  /* Account */
  .posn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .posn.alert { border-color: rgba(248,81,73,.6); }
  .posn .top { display: flex; align-items: baseline; gap: 10px; }
  .posn .big { font-size: 1.05rem; font-weight: 700; margin-left: auto; }
  .posn .stops { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 10px; }
  .posn .stops div { background: var(--panel2); border-radius: 8px; padding: 5px 6px; min-width: 0; }
  .posn .stops .k { font-size: 0.64rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .posn .stops .v { font-weight: 600; font-size: 0.88rem; white-space: nowrap; }
  .posn .stops .on { outline: 1.5px solid var(--amber); }
  .posn .stops .dim { opacity: .55; }
  .posn .also { color: var(--muted); font-size: 0.72rem; margin-top: 6px; }
  .posn .hit { color: var(--red); font-size: 0.78rem; margin-top: 8px; }
  .buy { color: var(--green); font-weight: 600; } .sell { color: var(--red); font-weight: 600; }
  /* Market */
  .mk-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; align-items: start; }
  .mk { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid #3c4048; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .mk.good { border-top-color: var(--green); } .mk.warn { border-top-color: var(--amber); } .mk.bad { border-top-color: var(--red); }
  .mk .l { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .mk .l i { font-style: normal; opacity: .6; }
  .mk-cards.even { align-items: stretch; margin-bottom: 4px; }        /* Account stats: one row, equal boxes */
  .mk-cards.even { gap: 5px; }
  .mk.na { opacity: .4; }
  .mk-cards.even .mk { padding: 7px 7px; border-radius: 10px; }
  .mk-cards.even .l { white-space: nowrap; letter-spacing: 0; font-size: 0.58rem; }
  .mk-cards.even .v { font-size: 0.95rem; white-space: nowrap; overflow: hidden; }
  .rowlab { font-size: 0.7rem; font-weight: 600; color: var(--text); text-transform: uppercase; letter-spacing: .05em; margin: 8px 2px 5px; }
  .rowlab span { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 4px; }
  .openr { font-size: 0.75rem; color: var(--muted); margin: 0 2px 10px; }
  .mk .v { font-size: 1.2rem; font-weight: 700; margin-top: 3px; }
  .mk .s { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .mk .info { display: none; font-size: 0.74rem; color: var(--text); opacity: .85; margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); line-height: 1.4; }
  .mk.open .info { display: block; }
  .mk-flag { font-size: 0.78rem; color: var(--amber); margin: 0 0 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 6px; margin-bottom: 12px; }
  .panel h3 { font-size: 0.9rem; margin: 2px 2px 8px; display: flex; align-items: baseline; gap: 8px; }
  .panel h3 .sub { font-weight: 400; }
  #breadth-cv { height: 170px; }
  /* Market/Account tables: fixed layout so a long name wraps instead of widening the page */
  table.st.fit { table-layout: fixed; font-size: 0.74rem; }
  table.st.fit th, table.st.fit td { padding-left: 3px; padding-right: 3px; }
  table.st.fit td:first-child { white-space: normal; overflow-wrap: break-word; }
  table.st.fit th.n, table.st.fit td:not(:first-child) { width: 17%; }
  table.st.fit th.n4 { width: 19%; }
  table.st.sec6 td:not(:first-child), table.st.sec6 th:not(:first-child) { width: 14%; }
  table.st.sec6 th:last-child, table.st.sec6 td:last-child { width: 17%; }
  .view > .pad { overflow-x: hidden; }   /* never let a screen pan sideways */
  table.st td.pos { color: var(--green); } table.st td.neg { color: var(--red); }
  table.st tr.lead td { background: var(--panel2); font-size: 0.72rem; }
  table.st tr.lead .tk { font-size: 0.8rem; }
  table.st tr.sec { cursor: pointer; }
  table.st tr.sec td:first-child::before { content: "▸ "; color: var(--faint); }
  table.st tr.sec.open td:first-child::before { content: "▾ "; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin: -2px 0 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--muted); border: 0; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; }
  .seg button.on { background: rgba(88,166,255,.16); color: var(--text); }
  .tbtn { background: var(--panel); border: 1px solid var(--line); color: var(--blue); border-radius: 9px; padding: 6px 10px; font-size: 0.8rem; cursor: pointer; }
  .tbtn[disabled] { opacity: .4; }
  .stw { border: 1px solid var(--line); border-radius: 10px; }  /* no own scroll box: the header sticks to the page as it scrolls */
  table.st { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
  table.st th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-weight: 600; text-align: left;
    padding: 7px 4px; cursor: pointer; white-space: nowrap; z-index: 1; }
  table.st th.sorted { color: var(--text); }
  table.st td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  table.st td .sub { font-size: 0.68rem; }
  table.st tr.out { opacity: .55; }
  .grade.sm { width: 26px; height: 22px; font-size: 0.72rem; border-radius: 6px; }
  .wl { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel2); margin: 4px 0 2px; }
  .wl i { background: var(--green); } .wl b { background: var(--red); }
  .tiprow td { padding-top: 0 !important; }
  .gtip { white-space: normal; overflow-wrap: break-word; font-size: 0.74rem; color: var(--text); opacity: .85; background: var(--panel2); border-radius: 8px; padding: 6px 8px; margin: 6px 0 2px; line-height: 1.35; }
  .grade[data-gtip] { cursor: pointer; }
  .offplan { font-size: 0.66rem; font-weight: 700; color: var(--red); border: 1px solid rgba(248,81,73,.5); border-radius: 999px; padding: 1px 7px; margin-left: 6px; white-space: nowrap; }
  .ern { font-size: 0.66rem; font-weight: 700; color: var(--amber); border: 1px solid rgba(210,153,34,.55); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .ern.skip { color: var(--red); border-color: rgba(248,81,73,.5); }
  .offplan.sm { margin-left: 0; padding: 0 5px; }
  .warnc { color: var(--amber); }
  .live h3 { display: flex; align-items: center; gap: 6px; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .live .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  tr.hitrow td { background: rgba(248,81,73,.12); }
  tr.lrow { cursor: pointer; }
  .vchip { display: inline-block; font-weight: 700; border-radius: 6px; padding: 0 5px; }
  .vchip.inline { color: var(--muted); background: var(--panel2); }
  .vchip.lagging { color: var(--red); background: rgba(248,81,73,.14); } .vchip.leading { color: var(--green); background: rgba(63,185,80,.14); }
  .vchip.strong { outline: 1px solid currentColor; }
  .tone-bull { color: var(--green); } .tone-bear { color: var(--red); } .tone-transition { color: var(--amber); }
  .readlist { margin: 8px 0 4px; padding-left: 18px; font-size: 0.82rem; } .readlist li { margin: 3px 0; }
  table.st.trend-t td:first-child, table.st.tape-t td:first-child { width: 42%; }
  .bookline { font-size: 0.8rem; margin: 2px 0 8px; padding: 6px 8px; border-radius: 8px; background: var(--panel2); border-left: 3px solid var(--muted); }
  .bookline.lagging { border-left-color: var(--red); } .bookline.leading { border-left-color: var(--green); } .bookline.inline { border-left-color: var(--blue); }
  .grade.inl { display: inline-flex; vertical-align: middle; margin-right: 5px; }
  .grade.off { opacity: .55; outline: 1px dashed var(--muted); }   /* not armed on the screen that day */
  #toast { position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 999px; font-size: 0.8rem; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 60; }
  #toast.on { opacity: 1; }
  .more { width: 100%; background: var(--panel); border: 1px dashed var(--line); color: var(--muted);
    border-radius: 12px; padding: 10px; cursor: pointer; }

  /* Backtest tab */
  table.st.bt-g td:first-child, table.st.bt-c td:first-child { width: 20%; }
  table.st.bt-x tr.on td { background: rgba(88,166,255,.08); font-weight: 600; }
  .verdict { font-size: 0.82rem; margin: 2px 0 10px; padding: 8px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--muted); }
  .verdict.behind { border-left-color: var(--amber); } .verdict.ahead { border-left-color: var(--green); }
  .verdict b { font-weight: 700; }
  /* Report list */
  .list a { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; margin-bottom: 10px; color: var(--text); text-decoration: none; }
  .list .t { font-weight: 600; } .list .d { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .back { background: none; border: 0; color: var(--blue); padding: 8px 16px; cursor: pointer; font-size: 0.9rem; }
  #research-frame { display: none; height: 100%; }
  #research-frame iframe { width: 100%; height: calc(100% - 38px); border: 0; display: block; }

  /* Settings sheet */
  /* Ticker page: slides over any tab */
  #tsheet { position: fixed; inset: 0; background: var(--bg); z-index: 45; display: none; overflow-y: auto; }
  #tsheet.open { display: block; }
  #tsheet .tbox { max-width: 760px; margin: 0 auto; padding: calc(12px + var(--safe-t)) 16px 40px; }
  #tsheet .thead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  #tsheet .thead b { font-size: 1.3rem; } #tsheet .grow { flex: 1; }
  #tsheet .thead a { color: var(--blue); text-decoration: none; font-size: 0.85rem; }
  #ts-chart { height: 300px; }
  .tkl { color: var(--text); text-decoration: none; cursor: pointer; }
  .disc .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin: 8px 0; font-size: 0.85rem; }
  .disc .score { font-size: 1.6rem; font-weight: 700; }
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: none; align-items: flex-end; }
  #sheet.open { display: flex; }
  #sheet .box { background: var(--panel); width: 100%; max-width: 560px; margin: 0 auto; border-radius: 16px 16px 0 0;
    padding: 18px 18px calc(18px + var(--safe-b)); }
  #sheet label { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 4px; }
  #sheet input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 16px; }
  #sheet .row { display: flex; gap: 10px; margin-top: 16px; }
  #sheet .row button { flex: 1; padding: 11px; border-radius: 10px; border: 0; cursor: pointer; }
  .primary { background: var(--blue); color: #0d1117 !important; font-weight: 700; }
  .ghost { background: var(--panel2); }
</style>
</head>
<body>

<header id="market">
  <div class="mrow">
    <span id="cycle" class="pill unknown">…</span>
    <div id="advice">Loading market state…</div>
    <div id="bandpick" title="Exit: trail at close minus k x ADR"><span>Exit</span><div class="seg"></div></div>
    <button class="iconbtn" id="settings-btn" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div id="conf"></div>
  <div id="mstats"></div>
  <div id="stale"></div>
</header>

<main>
  <section class="view" id="view-today"><div class="pad" id="today"></div></section>
  <section class="view" id="view-market"><div class="pad" id="market-view"></div></section>
  <section class="view" id="view-backtest">
    <div class="pad" id="backtest-view"></div>
    <div id="research-frame"><button class="back" onclick="location.hash='#backtest'">‹ Backtest</button><iframe title="Report"></iframe></div>
  </section>
  <section class="view" id="view-account"><div class="pad" id="account-view"></div></section>
</main>

<nav>
  <button data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Today</button>
  <button data-view="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/></svg>Market</button>
  <button data-view="backtest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16"/><path d="M6 16v-4M11 16V7M16 16v-6M21 16V4" transform="translate(-1 0)"/></svg>Backtest</button>
  <button data-view="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Account</button>
</nav>

<div id="tsheet" role="dialog" aria-label="Ticker">
  <div class="tbox">
    <div class="thead"><b id="ts-title"></b><span class="sub" id="ts-sub"></span><span class="grow"></span>
      <a id="ts-tv" target="_blank" rel="noopener">TradingView ›</a><button class="iconbtn" id="ts-close" aria-label="Close">✕</button></div>
    <div id="ts-body"></div>
  </div>
</div>
<div id="sheet" role="dialog" aria-label="Settings">
  <div class="box">
    <h2>Position sizing</h2>
    <div class="sub">Stored on this device only. Used to work out share counts on ‘Today’.</div>
    <label for="acct">Account size ($)</label><input id="acct" type="number" inputmode="decimal" min="0">
    <label for="risk">Risk per trade (% of account)</label><input id="risk" type="number" inputmode="decimal" step="0.1" min="0">
    <div class="row"><button class="ghost" id="sheet-cancel">Cancel</button><button class="primary" id="sheet-save">Save</button></div>
  </div>
</div>

<script>
(function () {
  // ---------- settings (this device only) ----------
  const DEF = { acct: 10000, risk: 0.75 };   // 0.75% a trade since 2026-10-05 (more, smaller positions tested better)
  function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  let settings = Object.assign({}, DEF, load("md.settings", {}));
  if (load("md.settings.v", 0) < 2) { if (settings.risk === 1) settings.risk = 0.75; save("md.settings", settings); save("md.settings.v", 2); }
  // The exit everywhere: trail at close - k x ADR once that is above the entry. "auto" (the default
  // since 2026-10-03, exit_rule.py) picks k from the market the day before entry: 4x while the index is
  // under 5% above its 200-day, 6x at 5-10%, 8x above. A trade keeps the band it entered with. The pick
  // is this device's and applies to every screen; unpicked bands draw dotted.
  const BAND_KS = [2, 4, 6, 8], EXIT_KS = ["auto", 2, 4, 6, 8], DEFAULT_BAND = "auto";
  let band = load("md.band", DEFAULT_BAND);
  if (load("md.band.v", 0) < 2) { band = "auto"; save("md.band", band); save("md.band.v", 2); }   // Auto becomes the default once
  if (!EXIT_KS.includes(band)) band = DEFAULT_BAND;
  const AUTO_COL = "rgba(63,185,80,1)";
  const blk = (k) => k === "auto" ? "Auto" : k + "×";             // a band's label
  const bl = () => blk(band);
  // The band new entries get today (Auto follows today.json's market reading), and a position's own band.
  const autoToday = () => (typeof data !== "undefined" && data && data.auto && data.auto.band) || 4;   // Auto's band for entries today
  const todayBand = () => band === "auto" ? autoToday() : band;
  const posBand = (p) => band === "auto" ? ((p && p.auto_band) || todayBand()) : band;
  const bandText = (k) => k === "auto"
    ? `Auto: trail the stop at close − k× ADR once that's above your entry, k set by the market the day before entry — 4× while the index is under 5% above its 200-day, 6× at 5–10%, 8× above (today: ${todayBand()}×). Until then the 1× ADR stop.`
    : `Trail the stop at close − ${k}× ADR once that's above your entry (so it never drops back below breakeven); until then the 1× ADR stop.`;
  const GRADES = ["A+", "A", "B", "C", "D", "F"];
  const GROUPS = { top: ["A+", "A"], All: GRADES };   // the plan: A+ and A (3+ points) since 2026-10-05
  GRADES.forEach((g) => GROUPS[g] = [g]);
  let filters = Object.assign({ grade: "top", strategy: "All", q: "", view: "cards", sort: "" }, load("md.filters", {}));
  if (!GROUPS[filters.grade]) filters.grade = "top";   // e.g. the old "AB" setting
  const ernTag = (e, short) => {
    if (!e) return "";
    const d = e.in_days === 0 ? "today" : e.in_days === 1 ? "tmrw" : e.in_days + "d";
    return `<span class="ern${e.skip ? " skip" : ""}">${short ? "ER " + d : (e.skip ? "skip · " : "") + "earnings " + d}</span>`;
  };
  const gcls = (g) => "g" + String(g).replace("+", "p");

  const $ = (s) => document.querySelector(s);
  const fmt = (n, d = 2) => n == null ? "–" : Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- routing ----------
  const VIEWS = ["today", "market", "backtest", "account"];
  const LEGACY = { journal: "account", industry: "market", strategy: "market", markets: "market", desk: "market", research: "backtest",
                   gallery: "backtest/setup-gallery.html", grades: "backtest/setup-grades.html" };
  function route() {
    let h = location.hash.replace(/^#/, "");
    const q = new URLSearchParams(location.search).get("tab");
    if (!h && q) h = q;                          // old email links: ?tab=strategy
    if (LEGACY[h]) h = LEGACY[h];
    let [view, sub] = h.split("/");
    if (view === "research") view = "backtest";   // old #research/<page> links
    const v = VIEWS.includes(view) ? view : "today";
    document.querySelectorAll(".view").forEach((el) => el.classList.toggle("active", el.id === "view-" + v));
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === v));
    const frame = document.querySelector("#view-" + v + " > iframe");
    if (frame && !frame.getAttribute("src")) frame.src = frame.dataset.src;
    if (v === "market") renderMarket2();
    if (v === "account") {
      renderAccount(); loadLive();
      if (!liveTimer) liveTimer = setInterval(() => { if (location.hash.startsWith("#account") && !document.hidden) loadLive(); }, 120000);
    }
    if (v === "backtest") {
      $("#backtest-view").style.display = sub ? "none" : "";
      if (!sub) renderBacktest();
      $("#research-frame").style.display = sub ? "block" : "none";
      if (sub) { const f = $("#research-frame iframe"); if (f.getAttribute("src") !== sub) f.src = sub; }
    }
  }
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.view; }));
  window.addEventListener("hashchange", route);

  function sizeTop() { document.documentElement.style.setProperty("--top-h", $("#market").offsetHeight + "px"); }
  window.addEventListener("resize", sizeTop);

  // ---------- market bar ----------
  const signed = (v, d) => (v > 0 ? "+" : "") + fmt(v, d) + "%";
  function renderMarket(d) {
    const m = d.market || {};
    const pill = $("#cycle");
    pill.className = "pill " + (m.cycle || "unknown");
    pill.textContent = m.cycle_name || "Unknown";
    $("#advice").textContent = m.advice || "";
    const stat = (k, v) => v == null ? "" : `<span>${k} <b>${esc(v)}</b></span>`;
    $("#mstats").innerHTML = [
      stat("Index vs 200d", m.index_vs_200d_pct == null ? null : signed(m.index_vs_200d_pct, 1)),
      stat("Market 20d", m.market_20d_pct == null ? null : signed(m.market_20d_pct, 1)),
      stat("Above 50d", m.pct_above_50ma == null ? null : fmt(m.pct_above_50ma, 0) + "%"),
      stat("Highs/Lows", m.new_highs == null ? null : m.new_highs + "/" + m.new_lows),
      stat("Regime", m.regime),
      stat("As of", d.date),
    ].join("");
    const c = d.confidence, conf = $("#conf");
    if (c) {
      conf.className = c.level; conf.style.display = "flex";
      conf.innerHTML = `<b>${esc(c.label)}</b><span>${esc(c.advice)}</span>`;
    }
    const age = (Date.now() - new Date(d.date + "T21:00:00Z").getTime()) / 864e5;
    if (age > 4) { $("#stale").style.display = "block"; $("#stale").textContent = `⚠ Data is from ${d.date} -- the nightly run may have failed.`; }
    sizeTop();
  }

  // ---------- today ----------
  let data = null, showAll = false;
  function shares(s) {
    const riskPerShare = s.pivot - s.stop;
    if (!(riskPerShare > 0)) return null;
    const size = (data && data.confidence && data.confidence.size) || 1;   // half size in a bear market
    const n = Math.floor(settings.acct * settings.risk * size / 100 / riskPerShare);
    return { n, cost: n * s.pivot, size };
  }
  function card(s) {
    const sh = shares(s);
    const chips = (s.reasons || []).map((r) => `<span class="rz ${r.startsWith("-") ? "n" : "p"}">${esc(r)}</span>`).join("");
    const why = (s.why || []).map((l) => {
      const pts = parseInt((l.match(/\(([-+]?\d+)\)$/) || [])[1] || "0", 10);
      return `<li class="${pts > 0 ? "p" : pts < 0 ? "n" : ""}">${esc(l)}</li>`;
    }).join("");
    const at = s.pct_to_pivot <= 0.001;
    const out = s.in_play === false;
    return `<div class="card ${openCharts.has(s.ticker) ? "open" : ""} ${out ? "out" : ""}" data-t="${esc(s.ticker)}">
      <div class="chead">
        <div class="grade ${gcls(s.grade)}">${esc(s.grade)}</div>
        <div class="grow">
          <a class="tk" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(s.ticker)}" target="_blank" rel="noopener">${esc(s.ticker)}</a>
          <div class="sub">${s._pick ? `<b>Pick #${s._pick}</b> · ` : ""}${esc(s.strategies.join(" + "))} · ${esc(s.sector)} · RS ${s.rs == null ? "–" : Math.round(s.rs)} · ADR ${fmt(s.adr_pct, 1)}%${s.grade_v1 && s.grade_v1 !== s.grade ? ` · <span title="the grade before 2026-10-05">old grade ${esc(s.grade_v1)}</span>` : ""}</div>
        </div>
        ${ernTag(s.earnings)}<span class="near ${s.pct_to_pivot <= 1 ? "hot" : ""}">${at ? "at pivot" : fmt(s.pct_to_pivot, 1) + "% below"}</span>
        <span class="caret" aria-hidden="true">▾</span>
      </div>
      <div class="levels">
        <div class="lv"><div class="k">Buy-stop</div><div class="v">$${fmt(s.pivot)}</div><div class="x">close $${fmt(s.close)}</div></div>
        <div class="lv"><div class="k">Stop</div><div class="v">$${fmt(s.stop)}</div><div class="x">1x ADR · $${fmt(s.pivot - s.stop)}/sh</div></div>
        <div class="lv"><div class="k">Shares</div><div class="v">${sh ? sh.n : "–"}</div><div class="x">${sh ? "$" + fmt(sh.cost, 0) + (sh.size < 1 ? " · ½ size" : "") + (sh.cost > settings.acct ? " · over acct" : "") : ""}</div></div>
      </div>
      <div class="reasons">${chips || '<span class="rz">no score factors</span>'}${out ? '<span class="outtag">outside today\'s grades</span>' : ""}</div>
      <details class="why"><summary>Why grade ${esc(s.grade)} (score ${s.score > 0 ? "+" : ""}${s.score})</summary><ul>${why}</ul></details>
      <div class="chartbox"></div>
    </div>`;
  }
  function renderToday() {
    const el = $("#today");
    if (!data) { el.innerHTML = '<div class="empty">No data yet -- it appears after the next nightly run.</div>'; return; }
    // Tonight's plan: A+ and A, or A+ only while recent plan trades are failing (setups_working.py).
    const SW = data.setups_working || null, PLAN_TONIGHT = (SW && SW.plan_today) || GROUPS.top;
    GROUPS.tonight = PLAN_TONIGHT;
    // Pick order: the setups come sorted higher score first, then the cheaper stock (selection_study.py).
    let pk = 0;
    data.setups.forEach((s) => { s._pick = PLAN_TONIGHT.includes(s.grade) ? ++pk : 0; });
    const swLine = SW && SW.value != null ? `<div class="openr" style="margin:-4px 0 8px">Setups working: <b class="${SW.value >= SW.failing_below ? "pos" : "neg"}">${rfmt(SW.value)}</b>
      a trade over the last ${SW.n} closed plan trades → <b>${PLAN_TONIGHT.length === 1 ? "A+ only tonight" : "A+ and A"}</b>${PLAN_TONIGHT.length === 1
        ? ". Breakouts are failing, so A setups wait until it's back above " + rfmt(SW.failing_below) + "." : "."}
      Not enough cash for all of them? Take them in pick order (higher score, then the cheaper stock).</div>` : "";
    const c = data.counts || {};
    const n = (g) => g === "All" ? data.setups.length : GROUPS[g === "top" ? "tonight" : g].reduce((a, x) => a + (c[x] || 0), 0);
    const gradeChip = (g, label) => `<button class="chip ${filters.grade === g ? "on" : ""}" data-g="${g}">${label}<span class="n">${n(g)}</span></button>`;
    const stratChip = (s) => `<button class="chip ${filters.strategy === s ? "on" : ""}" data-s="${s}">${s}</button>`;
    let rows = data.setups.filter((s) =>
      GROUPS[filters.grade === "top" ? "tonight" : filters.grade].includes(s.grade) &&
      (filters.strategy === "All" || s.strategies.includes(filters.strategy)) &&
      (!filters.q || (s.ticker + " " + s.sector).toLowerCase().includes(filters.q.toLowerCase())));
    const all = rows, LIMIT = 40, total = rows.length, tableView = filters.view === "table";
    if (!showAll && !tableView) rows = rows.slice(0, LIMIT);
    el.innerHTML = `
      <h2>Armed for next session</h2>
      ${swLine}
      <div class="chips">${gradeChip("top", PLAN_TONIGHT.length === 1 ? "Plan (A+)" : "Plan (A+ & A)")}${GRADES.filter((g) => g !== "F" || c.F).map((g) => gradeChip(g, g)).join("")}${gradeChip("All", "All")}</div>
      <div class="chips">${stratChip("All")}${stratChip("Minervini")}${stratChip("QM")}</div>
      <input class="search" id="q" placeholder="Search ticker or sector" value="${esc(filters.q)}" autocomplete="off">
      <div class="toolbar">
        <div class="seg"><button data-v="cards" class="${tableView ? "" : "on"}">Cards</button><button data-v="table" class="${tableView ? "on" : ""}">Table</button></div>
        <span class="grow"></span>
        <button class="tbtn" id="copy-wl" ${total ? "" : "disabled"}>Copy</button>
        <button class="tbtn" id="export-wl" ${total ? "" : "disabled"}>⬇ .txt (${total})</button>
      </div>
      ${!rows.length ? '<div class="empty">Nothing matches.</div>' : tableView ? setupTable(rows) : rows.map(card).join("")}
      ${!tableView && !showAll && total > LIMIT ? `<button class="more" id="more">Show all ${total}</button>` : ""}
      <details class="foot"><summary>ⓘ Rules</summary>
        <b>Entry:</b> ${esc(data.rules.entry)}<br><b>Stop:</b> ${esc(data.rules.stop)}<br>
        <b>Exit (${bl()}):</b> ${esc(bandText(band))}<br><b>Grades:</b> ${esc(data.rules.grade)}<br>
        Shares = ${fmt(settings.risk, 1)}% of $${fmt(settings.acct, 0)} ÷ (buy-stop − stop). Change it in settings (⚙).
      </details>`;
    el.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => { filters.grade = b.dataset.g; save("md.filters", filters); renderToday(); });
    el.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => { filters.strategy = b.dataset.s; save("md.filters", filters); renderToday(); });
    const q = $("#q");
    q.oninput = () => {
      filters.q = q.value; save("md.filters", filters);
      const pos = q.selectionStart; renderToday();
      const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos);
    };
    const more = $("#more"); if (more) more.onclick = () => { showAll = true; renderToday(); };
    el.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { filters.view = b.dataset.v; save("md.filters", filters); renderToday(); });
    el.querySelectorAll("th[data-k]").forEach((th) => th.onclick = () => {
      filters.sort = filters.sort === th.dataset.k ? "-" + th.dataset.k : th.dataset.k; save("md.filters", filters); renderToday();
    });
    $("#export-wl").onclick = () => exportWatchlist(all, "download");
    $("#copy-wl").onclick = () => exportWatchlist(all, "copy");
    el.querySelectorAll(".card.open").forEach(drawChart);
  }

  // ---------- table view (sortable; good for building watchlists) ----------
  const COLS = [
    ["grade", "Gr", (s) => GRADES.indexOf(s.grade)], ["ticker", "Ticker", (s) => s.ticker],
    ["pivot", "Buy", (s) => s.pivot], ["stop", "Stop", (s) => s.stop],
    ["pct", "Dist", (s) => s.pct_to_pivot], ["adr", "ADR", (s) => s.adr_pct], ["rs", "RS", (s) => s.rs || 0],
  ];
  function setupTable(rows) {
    const k = filters.sort.replace("-", ""), col = COLS.find((c) => c[0] === k);
    if (col) {
      const dir = filters.sort.startsWith("-") ? -1 : 1;
      rows = rows.slice().sort((a, b) => { const x = col[2](a), y = col[2](b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
    }
    const head = COLS.map(([key, label]) => `<th data-k="${key}" class="${key === k ? "sorted" : ""}">${label}${key === k ? (filters.sort.startsWith("-") ? " ▾" : " ▴") : ""}</th>`).join("");
    const body = rows.map((s) => `<tr class="${s.in_play === false ? "out" : ""}">
      <td><span class="grade sm ${gcls(s.grade)}">${esc(s.grade)}</span></td>
      <td><a class="tk" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(s.ticker)}" target="_blank" rel="noopener">${esc(s.ticker)}</a>
        <div class="sub">${esc(s.strategies.join("+"))}</div>${ernTag(s.earnings)}</td>
      <td>${fmt(s.pivot)}</td><td>${fmt(s.stop)}</td>
      <td>${s.pct_to_pivot <= 0.001 ? "at" : fmt(s.pct_to_pivot, 1) + "%"}</td>
      <td>${fmt(s.adr_pct, 1)}%</td><td>${s.rs == null ? "–" : Math.round(s.rs)}</td></tr>`).join("");
    return `<div class="stw"><table class="st"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  // ---------- watchlist export (TradingView .txt: one ###section per grade) ----------
  function exportWatchlist(rows, how) {
    const order = GRADES.filter((g) => rows.some((s) => s.grade === g));
    const txt = order.map((g) => ["###" + g + " setups"].concat(rows.filter((s) => s.grade === g).map((s) => s.ticker)).join(",")).join(",");
    const label = filters.grade === "top" ? "plan" : filters.grade;
    const name = `watchlist-${data.date}-${label}${filters.strategy !== "All" ? "-" + filters.strategy : ""}.txt`;
    if (how === "copy") {
      const done = () => toast(`Copied ${rows.length} tickers`);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(done, () => prompt("Copy:", txt));
      return;
    }
    const file = new File([txt], name, { type: "text/plain" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      // Files only: with a title too, iOS hands some targets the title as a text snippet
      // instead of the file (TradingView then imported the file name as one "symbol").
      navigator.share({ files: [file] }).catch(() => {});   // iPhone: share sheet -> Save to Files / TradingView
      return;
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function toast(msg) {
    let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1600);
  }

  // ---------- tap a card: its chart opens inside it ----------
  // Candles, buy-stop, stop and the TradingView "ADR Trailing Bands"
  // (close - k x SMA(high - low, 20), k = 2/4/6/8), worked out here from
  // bars/<TICKER>.json exactly as the Pine script does.
  const openCharts = new Set(), charts = new Map();
  const LWC = "https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js";
  // Faint on purpose: visible for reference, but the candles stay the focus.
  const BANDS = [[2, "rgba(242,214,0,.25)"], [4, "rgba(255,152,0,.25)"], [6, "rgba(244,67,54,.25)"], [8, "rgba(194,24,91,.3)"]];
  let lib = null;
  function loadLib() {
    if (!lib) lib = new Promise((ok, no) => {
      const sc = document.createElement("script"); sc.src = LWC;
      sc.onload = () => ok(window.LightweightCharts); sc.onerror = () => { lib = null; no(new Error("chart library")); };
      document.head.appendChild(sc);
    });
    return lib;
  }
  const bars = {};
  function loadBars(t) {
    if (!bars[t]) bars[t] = fetch("bars/" + encodeURIComponent(t) + ".json", { cache: "no-cache" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch((e) => { delete bars[t]; throw e; });
    return bars[t];
  }
  function sma(xs, n) {
    const out = []; let run = 0;
    xs.forEach((x, i) => { run += x; if (i >= n) run -= xs[i - n]; out.push(i >= n - 1 ? run / n : null); });
    return out;
  }
  function legend(s) {
    return `<div class="legend">${BANDS.map(([k, c]) => k === todayBand()
        ? `<span><i class="sel" style="border-color:${c.replace(/[\d.]+\)$/, ".95)")}"></i><b>${k}× exit${band === "auto" ? " (Auto)" : ""}</b></span>`
        : `<span><i style="border-color:${c.replace(/[\d.]+\)$/, ".6)")}"></i>${k}×</span>`).join("")}
      <span><i class="pv"></i>Buy-stop</span>
      <span><i class="solid" style="border-color:var(--red)"></i>Stop</span>
      <a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(s.ticker)}" target="_blank" rel="noopener">TradingView ›</a></div>`;
  }
  function drawChart(cardEl) {
    const t = cardEl.dataset.t, s = data.setups.find((x) => x.ticker === t), box = cardEl.querySelector(".chartbox");
    if (!s || !box) return;
    const old = charts.get(t); if (old) { old.remove(); charts.delete(t); }
    const fallback = (why) => {
      box.innerHTML = s.chart ? `<img src="${esc(s.chart)}" alt="${esc(t)} chart">${legend(s)}`
                              : `<div class="msg">${why}</div>${legend(s)}`;
    };
    if (!s.bars) { fallback("No chart data for this one yet."); return; }
    box.innerHTML = `<div class="cv"><div class="msg">Loading chart…</div></div>${legend(s)}`;
    Promise.all([loadLib(), loadBars(t)]).then(([L, b]) => {
      if (!openCharts.has(t) || !cardEl.isConnected) return;
      const cv = box.querySelector(".cv"); cv.innerHTML = "";
      const chart = L.createChart(cv, {
        autoSize: true,
        layout: { background: { color: "transparent" }, textColor: "#8b949e", fontSize: 11 },
        grid: { vertLines: { visible: false }, horzLines: { color: "rgba(48,54,61,.45)" } },
        rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.08, bottom: 0.08 } },
        timeScale: { borderVisible: false, rightOffset: 8 },
        handleScroll: { vertTouchDrag: false },
      });
      charts.set(t, chart);
      const candles = b.t.map((d, i) => ({ time: d, open: b.o[i], high: b.h[i], low: b.l[i], close: b.c[i] }));
      const cs = chart.addCandlestickSeries({ upColor: "#3fb950", downColor: "#f85149", borderVisible: false,
        wickUpColor: "#3fb950", wickDownColor: "#f85149", priceLineVisible: false, lastValueVisible: false });
      cs.setData(candles);
      // No titles on the lines (they'd sit over the latest candles): the price
      // tags live on the axis and the legend below names each line.
      cs.createPriceLine({ price: s.pivot, color: "#58a6ff", lineWidth: 2, lineStyle: 0, title: "", axisLabelVisible: true });
      cs.createPriceLine({ price: s.stop, color: "#f85149", lineWidth: 2, lineStyle: 2, title: "", axisLabelVisible: true });
      const adr = sma(b.h.map((h, i) => h - b.l[i]), 20);
      BANDS.forEach(([k, color]) => {
        const sel = k === todayBand();   // the chosen exit is a solid line, the others dotted

          lineStyle: sel ? 0 : 1, priceLineVisible: false,
          lastValueVisible: false, crosshairMarkerVisible: false,
          autoscaleInfoProvider: () => null });   // scale to price, not to the lowest band
        line.setData(b.t.map((d, i) => adr[i] == null ? { time: d } : { time: d, value: b.c[i] - k * adr[i] }));
      });
      const n = candles.length;
      // ~9 months on screen; the empty space on the right keeps the axis
      // price tags clear of the latest candles.
      chart.timeScale().setVisibleLogicalRange({ from: Math.max(20, n - 180), to: n + 8 });
    }).catch(() => fallback("Chart couldn't load -- check your connection."));
  }
  document.addEventListener("click", (e) => {

  // ---------- Market (merged Desk + Markets; data from market.json) ----------
  let mkt = null, mktLoading = false, mktSort = load("md.mktsort", { sec: "-m3", ind: "-m3" }), openSec = new Set(), showAllInd = false;
  const SHORT = { "Information Technology": "Tech", "Communication Services": "Comms", "Consumer Discretionary": "Cons. Disc.",
                  "Consumer Staples": "Cons. Staples" };
  const pct = (v) => v == null ? "–" : (v > 0 ? "+" : "") + fmt(v, 1) + "%";
  const pc = (v) => v == null ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "";
  function sortRows(rows, key) {
    const k = key.replace("-", ""), dir = key.startsWith("-") ? -1 : 1;
    return rows.slice().sort((a, b) => {
      const x = a[k], y = b[k];
      if (x == null) return 1; if (y == null) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * dir;
    });
  }
  function th(tbl, key, label) {
    const cur = mktSort[tbl], on = cur.replace("-", "") === key;
    return `<th data-t="${tbl}" data-k="${key}" class="${on ? "sorted" : ""} ${key === "name" ? "" : "n"}">${label}${on ? (cur.startsWith("-") ? " ▾" : " ▴") : ""}</th>`;
  }
  function renderMarket2() {
    const el = $("#market-view");

      <td class="${pc(s.m1)}">${pct(s.m1)}</td><td class="${pc(s.m3)}">${pct(s.m3)}</td><td class="${pc(s.y1)}">${pct(s.y1)}</td></tr>`).join("");
    const trendPanels = marketTrend();
    el.innerHTML = `
      <h2>Market <span class="sub" style="font-weight:400">${esc(mkt.date)}</span></h2>
      <div class="mk-cards">${cards}</div>${flags}
      ${trendPanels}
      <div class="panel"><h3>Breadth <span class="sub">% of stocks above their <b style="color:var(--blue)">50-day</b> and <b style="color:var(--amber)">200-day</b> average, 60 sessions</span></h3><div id="breadth-cv"></div></div>
      <div class="panel"><h3>Sectors <span class="sub">tap a sector for its RS leaders</span></h3>
        <table class="st fit sec6"><thead><tr>${th("sec", "name", "Sector")}${th("sec", "d1", "1D")}${th("sec", "m1", "1M")}${th("sec", "m3", "3M")}${th("sec", "y1", "1Y")}${th("sec", "pct_rs70", "RS70")}</tr></thead><tbody>${secRows}</tbody></table>
        <div class="sub" style="margin:6px 2px">RS70 = share of the sector's names beating 70% of the market; the small number after it is how many clear a Minervini/QM screen.</div></div>
      <div class="panel"><h3>Industries <span class="sub">${indTotal} with 3+ names</span></h3>
        <table class="st fit"><thead><tr>${th("ind", "name", "Industry")}${th("ind", "m1", "1M")}${th("ind", "m3", "3M")}${th("ind", "y1", "1Y")}</tr></thead><tbody>${indRows}</tbody></table>
        ${!showAllInd && indTotal > 15 ? `<button class="more" id="ind-more" style="margin-top:8px">Show all ${indTotal}</button>` : ""}</div>
      <a class="tbtn" style="display:block;text-align:center;text-decoration:none;margin-bottom:16px" href="#backtest/industry.html">Heatmap &amp; trend charts ›</a>`;
    el.querySelectorAll(".mk").forEach((c) => c.onclick = () => c.classList.toggle("open"));

    });
    el.querySelectorAll("tr.sec").forEach((r) => r.onclick = (e) => {
      if (e.target.closest("a")) return;

  // Trend + today's tape (market.json "trend"): how the market is trending, and whether today's move is normal for it.
  function marketTrend() {
    const tr = mkt.trend;
    if (!tr) return "";
    const st = tr.state, label = { bull: "Uptrend", bear: "Downtrend", transition: "Transition", unknown: "Unclear" }[st.label] || "Unclear";
    const cell = (v) => v == null ? "<td>–</td>" : `<td class="${pc(v)}">${v > 0 ? "+" : ""}${fmt(v, 1)}%</td>`;
    const row = (name, key, note) => `<tr><td>${name}${note ? ` <span class="sub">${note}</span>` : ""}</td>${cell(tr.universe[key])}${tr.spy ? cell(tr.spy[key]) : "<td>–</td>"}</tr>`;
    const since = st.since ? new Date(st.since + "T12:00:00").toLocaleDateString([], { day: "numeric", month: "short" }) : "";
    const trendP = `<div class="panel"><h3>Trend <span class="sub"><b class="tone-${st.label}">${label}</b> · ${st.days} sessions${since ? " since " + since : ""}</span></h3>
      <table class="st fit trend-t"><thead><tr><th></th><th>Universe</th><th>S&amp;P 500</th></tr></thead><tbody>
        ${row("Close vs 20-day", "vs20")}${row("Close vs 50-day", "vs50")}${row("Close vs 200-day", "vs200")}
        ${row("50-day trend", "slope50", "10 sessions")}${row("20-day return", "ret20")}
        ${row("From 52-week high", "off_high", tr.universe.days_since_high ? tr.universe.days_since_high + "d ago" : "at high")}
      </tbody></table>
      <div id="trend-cv"></div>
      <div class="legend"><span><i style="border-color:#c9d1d9;border-top-style:solid"></i>Universe index</span>${mkt.trend.chart.spy ? '<span><i style="border-color:#a371f7;border-top-style:solid"></i>S&amp;P 500</span>' : ""}${mkt.trend.chart.qqq ? '<span><i style="border-color:#39c5cf;border-top-style:solid"></i>Nasdaq 100</span>' : ""}<span><i class="sel" style="border-color:#58a6ff"></i>50-day</span><span><i class="sel" style="border-color:#d29922"></i>200-day</span></div>
      <div class="sub" style="margin-top:4px">Universe = every stock scanned, equal-weighted (what the Bull / Bear read is based on). The S&amp;P 500 and Nasdaq 100 are weighted by company size, so a few mega-caps can lift them while the average stock falls.</div></div>`;
    const t = tr.tape, dl = new Date(t.date + "T12:00:00").toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
    const stat = (l, v, cls) => `<div class="mk" style="cursor:default"><div class="l">${l}</div><div class="v ${cls || ""}">${v}</div></div>`;
    const secs = mkt.sectors.filter((x) => x.d1 != null).slice().sort((a, b) => a.d1 - b.d1);
    const nm = (x) => `${esc(SHORT[x.name] || x.name)} ${pct(x.d1)}`;
    const movers = secs.length ? `<div class="sub" style="margin:6px 2px">Weakest: ${secs.slice(0, 2).map(nm).join(" · ")} &nbsp;|&nbsp; Strongest: ${secs.slice(-2).reverse().map(nm).join(" · ")}</div>` : "";
    const hist = tr.history.map((h) => `<tr><td>${new Date(h.date + "T12:00:00").toLocaleDateString([], { weekday: "short", day: "numeric" })}</td>
      <td class="${pc(h.spy_pct)}">${pct(h.spy_pct)}</td><td class="${pc(h.ew_pct)}">${pct(h.ew_pct)}</td>
      <td>${h.up_pct == null ? "–" : `<div class="wl"><i style="width:${h.up_pct}%"></i><b style="width:${100 - h.up_pct}%"></b></div>`}<div class="sub">${h.up_pct ?? "–"}% up</div></td></tr>`).join("");
    const tapeP = `<div class="panel"><h3>Today's tape <span class="sub">${dl}</span></h3>
      <div class="mk-cards even" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        ${stat("S&amp;P 500", pct(t.spy_pct), pc(t.spy_pct))}${stat("Universe", pct(t.ew_pct), pc(t.ew_pct))}
        ${stat("Stocks up", t.up_pct == null ? "–" : t.up_pct + "%", t.up_pct >= 50 ? "pos" : "neg")}${stat("20d lows", `${t.new_lows}<span class="sub"> / ${t.new_highs} hi</span>`, t.new_lows > t.new_highs ? "neg" : "")}
      </div>
      <ul class="readlist">${tr.read.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${movers}
      <table class="st fit tape-t"><thead><tr><th>Day</th><th>S&amp;P</th><th>Universe</th><th>Stocks up</th></tr></thead><tbody>${hist}</tbody></table></div>`;
    return trendP + tapeP;
  }
  let trendChart = null;
  function drawTrend() {
    const box = $("#trend-cv"), c = mkt.trend && mkt.trend.chart; if (!box || !c) return;

  // ---------- Backtest (from backtest.json) ----------
  // Closes the loop: what the rules made in the 2022-26 backtest, what they've made live since
  // 30 Jul on the same rules, by grade and market cycle, for the Exit picker's band.
  let bt = null, btLoading = false, btChart = null;
  const MORE = [
    ["review.html", "Strategy review", "The whole system in plain English: setups, grades, market confidence, exits"],
    ["setup-grades.html", "Setup grades", "What A+ to D setups look like on the five-point grade, with the ADR bands"],
    ["setup-gallery.html", "Setup gallery", "Best historical trades by category"],
    ["industry.html", "Full market report", "Heatmap, sector and industry trend charts"],
    ["backtest.html", "Old detailed report", "Superseded: built on today's index list (with hindsight) and the old grades"]];
  function renderBacktest() {
    const el = $("#backtest-view");
    if (!bt) {
      if (!btLoading) {
        btLoading = true; el.innerHTML = '<div class="empty">Loading…</div>';
        fetch("backtest.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw 0; return r.json(); })
          .then((d) => { bt = d; renderBacktest(); })
          .catch(() => { el.innerHTML = '<div class="empty">Backtest data appears after the next track-record run.</div>' + moreList(); })
          .finally(() => { btLoading = false; });
      }
      return;
    }
    // One question: on the rules we've set (A+ and A, buy-stop, 1× ADR stop), which exit would have done best,
    // overall and in each market condition? Every exit side by side; the Exit picker's band is marked "yours".
    const B = (k) => bt.bands[String(k)] || {};
    const XS = ["2", "4", "6", "8", "auto"].filter((k) => bt.bands[k]);   // every fixed band, then Auto
    const same = (k, x) => String(k) === String(x);
    const best = bt.best, mon = (d) => new Date(d + "T12:00:00").toLocaleDateString([], { month: "short", year: "numeric" });
    const pct = (v) => v == null ? "–" : (v > 0 ? "+" : "") + fmt(v, 0) + "%";
    const usd = (v) => v == null ? "–" : "$" + Math.round(10000 * (1 + v / 100)).toLocaleString();
    const plan = (k) => (B(k).backtest || {}).plan || {}, acc = (k) => B(k).account;
    const scope = bt.account_scope === "plan" ? "A+ and A" : "every grade";
    const bA = acc(best), bP = plan(best);
    const AU = bt.auto || {}, BM = bt.benchmark, PIT = bt.point_in_time;
    const autoNow = AU.band_now ? `Auto today: <b>${AU.band_now}×</b> (index ${AU.strength_now > 0 ? "+" : ""}${fmt(AU.strength_now, 1)}% vs its 200-day).` : "";
    const H = (k) => B(k).account_halves || null, hv = H(best);
    const halfTxt = hv ? Object.entries(hv).map(([lab, a]) => `${lab.replace("20", "").replace("-", "–")} ${pct(a.return_pct)}`).join(", ") : "";
    // Headline first, the why underneath, the S&P last: three short lines, not a paragraph.
    const exitName = best === "auto" ? "Auto" : best + "×";
    const verdict = best == null || !bA ? "" : `<div class="verdict ahead">
      <div style="font-size:1.05em">$10,000 → <b>${usd(bA.return_pct)}</b> <span class="sub">(${fmt(bA.cagr_pct, 0)}% a year, worst drop ${fmt(bA.max_dd_pct, 0)}%)</span></div>
      <div class="sub" style="margin-top:3px"><b style="color:var(--text)">${exitName}</b> is the best exit: it held up in both halves (${halfTxt || "–"}).
        ${fmt(bP.n, 0)} trades, ${rfmt(bP.avg_r)} each.${AU.band_now ? ` Auto uses ${AU.band_now}× today.` : ""}${!same(best, band) ? ` You're on ${bl()}.` : ""}</div>
      ${BM ? `<div class="sub" style="margin-top:3px">S&amp;P 500 instead: ${usd(BM.return_pct)} (${fmt(BM.cagr_pct, 0)}% a year, worst drop ${fmt(BM.max_dd_pct, 0)}%)</div>` : ""}</div>`;
